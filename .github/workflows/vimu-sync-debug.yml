name: Vimu Sync Debug APK

on:
  push:
    branches:
      - feature/vimu-timecode-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          echo "Installed Android platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Assemble side-by-side debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PciCompileSdk=36 --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TorrServe-Sync-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
