name: Vimu Sync Debug APK

on:
  push:
    branches:
      - feature/vimu-timecode-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Android SDK 37
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0"
      - name: Assemble side-by-side debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TorrServe-Sync-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
